[flavor]
dark = "gruvbox-dark"
light = "gruvbox-dark"

# Переопределения поверх flavor под встроенную тему gruvbox в herdr:
# accent #d79921, selection_bg #4b3f27, active_row_bg #323130, border overlay0 #928374.

[mgr]
cwd          = { fg = "#83a598", bold = true }
border_style = { fg = "#504945" }

[tabs]
active   = { fg = "#282828", bg = "#d79921", bold = true }
inactive = { fg = "#a89984", bg = "#3c3836" }

[mode]
normal_main = { fg = "#282828", bg = "#d79921", bold = true }
normal_alt  = { fg = "#d5c4a1", bg = "#504945" }
select_main = { fg = "#282828", bg = "#fe8019", bold = true }
select_alt  = { fg = "#d5c4a1", bg = "#504945" }
unset_main  = { fg = "#282828", bg = "#b8bb26", bold = true }
unset_alt   = { fg = "#d5c4a1", bg = "#504945" }

[indicator]
parent  = { fg = "#ebdbb2", bg = "#323130" }
current = { fg = "#fabd2f", bg = "#4b3f27", bold = true }
preview = { fg = "#ebdbb2", bg = "#323130" }
